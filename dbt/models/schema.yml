version: 2

models:
  - name: stg_listings
    description: "Cleaned, typed, deduplicated listings from RAW"
    columns:
      - name: listing_id
        tests: [unique, not_null]
      - name: price
        tests: [not_null]
      - name: scraped_at
        tests: [not_null]

  - name: int_listings_geo
    description: "Listings with centroid fallback applied"
    columns:
      - name: listing_id
        tests: [unique, not_null]
      - name: resolved_geo_source
        tests:
          - accepted_values:
              arguments:
                values: ['direct', 'centroid', 'unknown']

  - name: mart_rental_prices
    description: "Core analytics table with listing history"
    columns:
      - name: listing_id
        tests: [unique, not_null]
      - name: price
        tests: [not_null]

  - name: mart_suburb_benchmarks
    description: "Pre-aggregated suburb benchmarks for Power BI"
    columns:
      - name: suburb
        tests: [not_null]
      - name: bedrooms
        tests: [not_null]
