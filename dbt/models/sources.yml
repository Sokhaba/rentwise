version: 2

sources:
  - name: raw
    database: RENTWISE_DB
    schema: RAW
    description: "Raw listings loaded from S3"
    tables:
      - name: LISTINGS_RAW
        description: "Append-only raw listings"
        config:
          loaded_at_field: _loaded_at
          freshness:
            warn_after:  {count: 8,  period: day}
            error_after: {count: 14, period: day}
        columns:
          - name: listing_id
            tests: [not_null]
          - name: price
            tests: [not_null]
          - name: scraped_at
            tests: [not_null]
      - name: SA_SUBURB_CENTROIDS
        description: "Suburb lat/lon centroids for geo fallback"
