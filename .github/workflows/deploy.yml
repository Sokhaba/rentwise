# ============================================================
# Deploy — two triggers:
#   1. Push to main → deploys Prefect flow definition
#   2. Cron every Sunday 00:00 UTC → runs the full pipeline
#   3. Manual trigger → run pipeline on demand
#
# Required GitHub repository secrets:
#   PREFECT_API_KEY, PREFECT_WORKSPACE
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   SNOWFLAKE_ACCOUNT, SNOWFLAKE_USER, SNOWFLAKE_PASSWORD
#   SNOWFLAKE_WAREHOUSE, SNOWFLAKE_ROLE
# ============================================================

name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"   # Every Sunday 00:00 UTC = 02:00 SAST
  workflow_dispatch:        # Manual trigger from GitHub UI

env:
  PYTHON_VERSION: "3.13"

jobs:

  # ── Run the full pipeline (Sunday cron + manual trigger) ──────
  run-pipeline:
    name: Run weekly pipeline
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION:            us-east-1
      S3_BUCKET_NAME:        rentwise-raw
      SNOWFLAKE_ACCOUNT:     ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER:        ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD:    ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_DATABASE:    RENTWISE_DB
      SNOWFLAKE_WAREHOUSE:   ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE:        ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_RAW_SCHEMA:  RAW
      PREFECT_API_KEY:       ${{ secrets.PREFECT_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: Write dbt profiles
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'PROFILE'
          rentwise:
            target: prod
            outputs:
              prod:
                type: snowflake
                account: "${{ secrets.SNOWFLAKE_ACCOUNT }}"
                user: "${{ secrets.SNOWFLAKE_USER }}"
                password: "${{ secrets.SNOWFLAKE_PASSWORD }}"
                database: RENTWISE_DB
                warehouse: "${{ secrets.SNOWFLAKE_WAREHOUSE }}"
                role: "${{ secrets.SNOWFLAKE_ROLE }}"
                schema: STAGING
                threads: 4
          PROFILE

      - name: Run pipeline
        run: python -m pipeline.flows

      - name: Notify on failure
        if: failure()
        run: echo "Pipeline failed — check logs above"


  # ── Deploy Prefect flow definition (push to main only) ────────
  deploy-prefect:
    name: Deploy Prefect flow
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Prefect
        run: pip install prefect==3.4.4

      - name: Authenticate with Prefect Cloud
        run: prefect cloud login --key ${{ secrets.PREFECT_API_KEY }}

      - name: Deploy flow
        run: |
          prefect deploy pipeline/flows.py:rentwise_pipeline \
            --name "rentwise-weekly" \
            --pool rentwise-pool \
            --cron "0 0 * * 0" \
            --description "Weekly rental scrape → S3 → Snowflake → DBT"
