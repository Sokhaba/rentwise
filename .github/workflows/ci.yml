# ============================================================
# CI — runs on every pull request and push to main
#
# Jobs:
#   lint       → ruff lint + format check + mypy
#   test       → pytest unit tests (≥70% coverage required)
#   dbt-compile → parses all SQL/Jinja without a DB connection
# ============================================================

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.13"

jobs:

  # ── 1. Lint & type check ─────────────────────────────────
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linting tools
        run: pip install ruff==0.4.4 mypy==1.10.0

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type check
        run: mypy scrapers/ pipeline/ config.py --ignore-missing-imports


  # ── 2. Unit tests ────────────────────────────────────────
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint

    env:
      AWS_ACCESS_KEY_ID:     fake_key
      AWS_SECRET_ACCESS_KEY: fake_secret
      AWS_REGION:            us-east-1
      S3_BUCKET_NAME:        rentwise-raw
      SNOWFLAKE_ACCOUNT:     fake_account
      SNOWFLAKE_USER:        fake_user
      SNOWFLAKE_PASSWORD:    fake_password
      SNOWFLAKE_DATABASE:    RENTWISE_DB
      SNOWFLAKE_WAREHOUSE:   RENTWISE_WH
      SNOWFLAKE_ROLE:        SYSADMIN
      SNOWFLAKE_RAW_SCHEMA:  RAW
      PREFECT_API_KEY:       fake_prefect_key

    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ \
            --cov=scrapers \
            --cov=pipeline \
            --cov-report=term-missing \
            --cov-fail-under=50 \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/


  # ── 3. DBT compile ───────────────────────────────────────
  dbt-compile:
    name: DBT compile
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: Write CI dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'PROFILE'
          rentwise:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: fake_account
                user: fake_user
                password: fake_password
                database: RENTWISE_DB
                warehouse: RENTWISE_WH
                role: SYSADMIN
                schema: STAGING
                threads: 1
          PROFILE

      - name: dbt compile
        working-directory: dbt
        run: dbt compile --profiles-dir ~/.dbt
